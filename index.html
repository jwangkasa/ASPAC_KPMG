<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ASPAC SAP Leadership Summit, Tokyo, 26-29 October 2026. Connect. Challenge. Build what's next." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>ASPAC SAP Leadership Summit | KPMG × SAP</title>
    <style>
      #ascend-gate-overlay {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, #0d1b4d 0%, #060d2b 70%, #04081c 100%);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        padding: 1.5rem;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #ascend-gate-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .ascend-gate-card {
        width: 100%;
        max-width: 440px;
        background: rgba(10, 18, 56, 0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(201, 162, 75, 0.4);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 35px rgba(201, 162, 75, 0.18);
        border-radius: 16px;
        padding: 2.25rem 2rem;
        color: #ffffff;
        text-align: center;
      }
      .ascend-badge {
        display: inline-block;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #c9a24b;
        background: rgba(201, 162, 75, 0.12);
        border: 1px solid rgba(201, 162, 75, 0.35);
        padding: 0.35rem 0.95rem;
        border-radius: 9999px;
        margin-bottom: 1.25rem;
      }
      .ascend-title {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1.85rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 0.4rem;
        color: #ffffff;
      }
      .ascend-subtitle {
        font-size: 0.875rem;
        color: #a3b3d9;
        margin-bottom: 1.75rem;
        line-height: 1.45;
      }
      .ascend-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .ascend-input-wrapper {
        position: relative;
        text-align: left;
      }
      .ascend-input {
        width: 100%;
        box-sizing: border-box;
        background: rgba(6, 13, 43, 0.85);
        border: 1px solid rgba(163, 179, 217, 0.35);
        border-radius: 8px;
        padding: 0.85rem 1rem;
        font-size: 1rem;
        color: #ffffff;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        font-family: inherit;
      }
      .ascend-input:focus {
        border-color: #c9a24b;
        box-shadow: 0 0 0 3px rgba(201, 162, 75, 0.25);
      }
      .ascend-button {
        width: 100%;
        background: linear-gradient(135deg, #c9a24b 0%, #b89138 100%);
        color: #060d2b;
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: none;
        border-radius: 8px;
        padding: 0.85rem 1rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
        font-family: 'Barlow Condensed', sans-serif;
      }
      .ascend-button:hover {
        background: linear-gradient(135deg, #ddb55a 0%, #c9a24b 100%);
        box-shadow: 0 4px 16px rgba(201, 162, 75, 0.45);
      }
      .ascend-button:active {
        transform: scale(0.98);
      }
      .ascend-error {
        color: #ff6b6b;
        font-size: 0.825rem;
        margin-top: -0.25rem;
        display: none;
        font-weight: 500;
      }
      .ascend-footer {
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: #6d7f9e;
        letter-spacing: 0.03em;
      }
    </style>
  </head>
  <body>
    <div id="ascend-gate-overlay">
      <div class="ascend-gate-card">
        <div class="ascend-badge">KPMG × SAP · Tokyo 2026</div>
        <h1 class="ascend-title">ASPAC Leadership Summit</h1>
        <p class="ascend-subtitle">This presentation is restricted. Please enter the passcode to continue.</p>
        <form class="ascend-form" id="ascend-auth-form" onsubmit="return false;">
          <div class="ascend-input-wrapper">
            <input
              type="password"
              id="ascend-passcode-input"
              class="ascend-input"
              placeholder="Enter passcode"
              autocomplete="current-password"
              autofocus
            />
          </div>
          <div id="ascend-error-msg" class="ascend-error">Incorrect passcode. Please try again.</div>
          <button type="submit" id="ascend-submit-btn" class="ascend-button">Unlock Presentation</button>
        </form>
        <div class="ascend-footer">Tokyo, 26–29 October 2026 · Confidential</div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function() {
        const AUTH_KEY = 'ascend_summit_authenticated';
        const REQUIRED_PASS = 'ASCEND_2026!';
        const overlay = document.getElementById('ascend-gate-overlay');
        const form = document.getElementById('ascend-auth-form');
        const input = document.getElementById('ascend-passcode-input');
        const error = document.getElementById('ascend-error-msg');
        const root = document.getElementById('root');

        if (sessionStorage.getItem(AUTH_KEY) === 'true') {
          overlay.style.display = 'none';
        } else {
          root.style.visibility = 'hidden';
        }

        function unlock() {
          if (input.value === REQUIRED_PASS) {
            sessionStorage.setItem(AUTH_KEY, 'true');
            error.style.display = 'none';
            root.style.visibility = 'visible';
            overlay.classList.add('hidden');
            setTimeout(function() {
              overlay.style.display = 'none';
            }, 400);
          } else {
            error.style.display = 'block';
            input.focus();
            input.select();
          }
        }

        form.addEventListener('submit', function(e) {
          e.preventDefault();
          unlock();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
